<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Beam — direct device-to-device transfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#0B0F0D;
    --surface:#121815;
    --surface-2:#19211D;
    --border:#26332C;
    --text:#E9F2ED;
    --text-muted:#87A296;
    --amber:#FFB454;
    --amber-dim:#7A5A2A;
    --teal:#4FD1C5;
    --teal-dim:#265650;
    --coral:#FF6B6B;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #101915 0%, var(--bg) 55%), var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:28px 20px 80px;}
  header.top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(145deg, var(--amber), #E08A2C);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .mark svg{width:16px;height:16px;}
  h1{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-0.01em;margin:0;}
  .tagline{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);margin:0 0 24px 40px;letter-spacing:0.01em;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .card h2{font-family:var(--font-display);font-size:14px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .card h2 .hint{font-family:var(--font-mono);font-weight:400;font-size:10.5px;color:var(--text-muted);}

  /* beacon */
  .beacon-zone{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;}
  .beacon{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .beacon .ring{position:absolute;border-radius:50%;border:1px solid var(--amber-dim);opacity:0;}
  .beacon.state-broadcast .ring{animation:pulse 2.2s ease-out infinite;border-color:var(--amber);}
  .beacon.state-connected .ring{border-color:var(--teal-dim);opacity:.4;animation:none;}
  .beacon .ring:nth-child(1){width:70%;height:70%;animation-delay:0s;}
  .beacon .ring:nth-child(2){width:85%;height:85%;animation-delay:.4s;}
  .beacon .ring:nth-child(3){width:100%;height:100%;animation-delay:.8s;}
  @keyframes pulse{0%{transform:scale(.75);opacity:.9;}100%{transform:scale(1);opacity:0;}}
  #qrHolder{background:#fff;padding:12px;border-radius:8px;line-height:0;position:relative;z-index:1;}
  #qrHolder img,#qrHolder canvas{display:block;}

  .status-line{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:7px;margin-top:4px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex-shrink:0;}
  .dot.amber{background:var(--amber);}
  .dot.teal{background:var(--teal);box-shadow:0 0 6px var(--teal);}
  .dot.coral{background:var(--coral);}

  .room-code{font-family:var(--font-mono);font-size:13px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);padding:6px 12px;border-radius:6px;margin-top:12px;letter-spacing:0.03em;}

  .divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

  .join-row{display:flex;gap:8px;}
  .join-row input{
    flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:var(--font-mono);font-size:13px;padding:9px 10px;
  }
  .join-row button{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    font-family:var(--font-body);font-weight:600;font-size:13px;padding:0 16px;border-radius:8px;cursor:pointer;
  }
  .join-row button:hover{border-color:var(--amber);}

  #connectedBar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
  #connectedBar .status-line{margin:0;}
  #connectedBar button{
    background:none;border:1px solid var(--border);color:var(--text-muted);
    font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;
  }
  #connectedBar button:hover{border-color:var(--coral);color:var(--coral);}

  /* picker */
  .drop{border:1.5px dashed var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;cursor:pointer;transition:border-color .15s, background .15s;}
  .drop:hover,.drop.drag{border-color:var(--amber);background:rgba(255,180,84,0.04);}
  .drop p{margin:0;font-size:13.5px;color:var(--text-muted);}
  .drop strong{color:var(--text);font-weight:600;}
  input[type=file]{display:none;}
  textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:var(--font-body);font-size:13.5px;padding:10px 12px;resize:vertical;min-height:56px;margin-top:12px;
  }
  textarea:focus,.drop:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .queue{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .item{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .item-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
  .thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg);border:1px solid var(--border);}
  .thumb.icon{display:flex;align-items:center;justify-content:center;font-size:15px;}
  .item-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-meta{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);flex-shrink:0;}
  .item-remove{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:15px;padding:0 2px;line-height:1;}
  .item-remove:hover{color:var(--coral);}
  .bar{height:4px;border-radius:3px;background:var(--border);margin-top:8px;overflow:hidden;}
  .bar-fill{height:100%;width:0%;background:var(--teal);transition:width .15s linear;}
  .item.done .bar-fill{background:var(--teal);}
  .item.error .bar-fill{background:var(--coral);}
  .item-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .badge{font-family:var(--font-mono);font-size:9.5px;padding:1px 6px;border-radius:99px;border:1px solid var(--teal-dim);color:var(--teal);}
  .item-text-preview{
    font-family:var(--font-mono);font-size:12px;color:var(--text-muted);background:var(--bg);
    border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:8px;max-height:90px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  }
  .save-link,.action-btn{
    display:inline-block;margin-top:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--teal);
    text-decoration:none;border:1px solid var(--teal-dim);padding:4px 10px;border-radius:6px;background:none;cursor:pointer;
  }
  .save-link:hover,.action-btn:hover{background:rgba(79,209,197,0.08);}
  .action-btn.view{color:var(--amber);border-color:var(--amber-dim);}
  .copy-btn{
    font-family:var(--font-mono);font-size:11px;color:var(--text-muted);background:none;border:1px solid var(--border);
    padding:3px 9px;border-radius:6px;cursor:pointer;margin-top:6px;
  }
  .copy-btn:hover{border-color:var(--text-muted);color:var(--text);}

  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .parallel-ctrl{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
  .parallel-ctrl select{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    font-family:var(--font-mono);font-size:11px;padding:4px 6px;border-radius:6px;
  }

  button.primary{
    background:var(--amber);color:#1A1206;border:none;font-family:var(--font-body);font-weight:600;
    font-size:13px;padding:8px 14px;border-radius:8px;cursor:pointer;transition:filter .15s;
  }
  button.primary:hover{filter:brightness(1.08);}
  button.primary:disabled{background:var(--surface-2);color:var(--text-muted);cursor:not-allowed;}

  .log{
    font-family:var(--font-mono);font-size:11px;color:var(--text-muted);background:var(--surface-2);
    border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:16px;max-height:110px;overflow-y:auto;
  }
  .log div{padding:1px 0;}
  .log .ok{color:var(--teal);}
  .log .warn{color:var(--coral);}

  .empty-hint{text-align:center;color:var(--text-muted);font-size:13px;padding:20px 10px;}
  .empty-hint .big{font-family:var(--font-mono);font-size:12px;display:block;margin-top:6px;}

  footer{text-align:center;font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);opacity:.6;margin-top:26px;}

  .lightbox{
    position:fixed;inset:0;background:rgba(4,6,5,0.9);display:none;align-items:center;justify-content:center;
    z-index:50;padding:30px;
  }
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .lightbox button{
    position:absolute;top:20px;right:20px;background:var(--surface);border:1px solid var(--border);
    color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;
  }

  @media (prefers-reduced-motion: reduce){.beacon .ring{animation:none !important;}}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12c2-4 4-6 8-6s6 2 8 6" stroke="#1A1206" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="16" r="2" fill="#1A1206"/>
      </svg>
    </div>
    <h1>Beam</h1>
  </header>
  <p class="tagline">device-to-device. no upload, no server relay.</p>

  <!-- CONNECT PANEL -->
  <div class="card" id="connectPanel">
    <div class="beacon-zone">
      <div class="beacon" id="beacon">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div id="qrHolder"></div>
      </div>
      <div class="status-line"><span class="dot" id="statusDot"></span><span id="statusText">starting…</span></div>
      <div class="room-code" id="roomCode" style="display:none"></div>
    </div>
    <div class="divider">or connect to a code</div>
    <div class="join-row">
      <input type="text" id="roomInput" placeholder="paste a code" autocomplete="off">
      <button id="joinBtn">Connect</button>
    </div>
  </div>

  <!-- CONNECTED BAR -->
  <div class="card" id="connectedBar" style="display:none">
    <div class="status-line"><span class="dot teal"></span><span id="connectedText">connected</span></div>
    <button id="disconnectBtn">Disconnect</button>
  </div>

  <!-- YOUR ITEMS -->
  <div class="card">
    <h2>Your items</h2>
    <div id="dropZone" class="drop" tabindex="0" role="button" aria-label="Choose files to share">
      <p><strong>Tap to choose files</strong><br>or drag them here</p>
    </div>
    <input type="file" id="fileInput" multiple>
    <textarea id="textInput" placeholder="…or paste/type text to share"></textarea>
    <div class="queue" id="myQueueList"></div>
  </div>

  <!-- THEIR ITEMS -->
  <div class="card" id="theirCard" style="display:none">
    <div class="row-between">
      <h2 style="margin:0">Their items <span class="hint" id="netHint"></span></h2>
    </div>
    <div class="row-between">
      <div class="parallel-ctrl">
        parallel transfers
        <select id="parallelSelect">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
      <button class="primary" id="downloadAllBtn">Download all</button>
    </div>
    <div class="queue" id="theirQueueList"></div>
  </div>

  <div class="log" id="logEl"></div>

  <footer>WebRTC data channel • signaling only touches a public broker, never your files</footer>
</div>

<div class="lightbox" id="lightbox">
  <button id="lightboxClose" aria-label="close">✕</button>
  <img id="lightboxImg" alt="preview">
</div>

<script>
(function(){
  "use strict";

  const PAYLOAD_CHUNK = 16 * 1024;      // 16KB payload per binary message (+1 byte slot header)
  const HIGH_WATER = 2 * 1024 * 1024;   // pause sending above this buffered amount
  const LOW_WATER  = 512 * 1024;        // resume sending below this
  const THUMB_MAX_DIM = 96;

  const $ = sel => document.querySelector(sel);
  const params = new URLSearchParams(location.search);
  const roomParam = params.get('room');

  // ---------- helpers ----------
  function fmtBytes(n){
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
    if(n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
    return (n/1024/1024/1024).toFixed(2) + ' GB';
  }
  function randomId(len){
    const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
    let s = '';
    for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  const logEl = $('#logEl');
  function log(msg, cls){
    const d = document.createElement('div');
    if(cls) d.className = cls;
    const t = new Date().toLocaleTimeString([], {hour12:false});
    d.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setDot(dot, color){ dot.className = 'dot' + (color ? ' ' + color : ''); }
  function fileSupportsStream(){ return typeof window.showSaveFilePicker === 'function'; }
  function isImageMime(mime){ return mime && mime.startsWith('image/'); }

  function generateThumb(file){
    return new Promise(resolve=>{
      if(!isImageMime(file.type)) return resolve(null);
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          const scale = Math.min(1, THUMB_MAX_DIM / Math.max(w, h));
          w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          try{ resolve(canvas.toDataURL('image/jpeg', 0.6)); }
          catch(e){ resolve(null); }
        };
        img.onerror = ()=> resolve(null);
        img.src = reader.result;
      };
      reader.onerror = ()=> resolve(null);
      reader.readAsDataURL(file);
    });
  }

  function thumbHtml(item){
    if(item.thumb) return `<img class="thumb" src="${item.thumb}" alt="">`;
    const icon = item.kind === 'text' ? '📝' : (isImageMime(item.mime) ? '🖼️' : '📄');
    return `<div class="thumb icon">${icon}</div>`;
  }

  // lightbox
  const lightbox = $('#lightbox');
  $('#lightboxClose').onclick = ()=> lightbox.style.display = 'none';
  lightbox.addEventListener('click', e=>{ if(e.target === lightbox) lightbox.style.display = 'none'; });
  function openLightbox(url){ $('#lightboxImg').src = url; lightbox.style.display = 'flex'; }

  // ============================================================
  // CONNECTION (symmetric — either side can initiate)
  // ============================================================
  const beacon = $('#beacon');
  const qrHolder = $('#qrHolder');
  const roomCodeEl = $('#roomCode');
  const statusDot = $('#statusDot');
  const statusText = $('#statusText');
  const connectPanel = $('#connectPanel');
  const connectedBar = $('#connectedBar');
  const connectedText = $('#connectedText');
  const theirCard = $('#theirCard');
  const netHint = $('#netHint');

  let myPeer = null;
  let conn = null;
  let sameNetwork = null; // null = unknown, true/false once detected

  function initPeer(){
    const id = 'beam-' + randomId(7);
    myPeer = new Peer(id, { debug: 1 });

    myPeer.on('open', pid=>{
      const url = location.origin + location.pathname + '?room=' + pid;
      qrHolder.innerHTML = '';
      new QRCode(qrHolder, { text: url, width: 156, height: 156, colorDark:'#0B0F0D', colorLight:'#ffffff' });
      roomCodeEl.textContent = pid;
      roomCodeEl.style.display = '';
      beacon.className = 'beacon state-broadcast';
      setDot(statusDot, 'amber');
      statusText.textContent = 'broadcasting — scan to connect';
      log('session ready: ' + pid);
      if(roomParam && roomParam !== pid) connectTo(roomParam);
    });

    myPeer.on('connection', c=>{
      if(conn && conn.open){ c.close(); return; } // one active connection at a time
      setConn(c);
    });

    myPeer.on('error', err=>{
      log('error: ' + err.type, 'warn');
      if(err.type === 'unavailable-id'){ initPeer(); }
    });
  }

  function connectTo(code){
    if(!myPeer || !myPeer.open){ log('still starting up, try again in a moment', 'warn'); return; }
    if(conn && conn.open){ log('already connected', 'warn'); return; }
    const c = myPeer.connect(code, { reliable: true });
    setConn(c);
  }

  $('#joinBtn').onclick = ()=>{
    const code = $('#roomInput').value.trim();
    if(code) connectTo(code);
  };
  $('#disconnectBtn').onclick = ()=>{ if(conn) conn.close(); };

  function setConn(c){
    conn = c;
    slotMap = {};
    conn.on('open', ()=>{
      beacon.className = 'beacon state-connected';
      connectPanel.style.display = 'none';
      connectedBar.style.display = 'flex';
      connectedText.textContent = 'connected to ' + conn.peer;
      log('connected: ' + conn.peer, 'ok');
      detectSameNetwork(conn).then(res=>{
        sameNetwork = res;
        netHint.textContent = res === true ? '· same network, auto-download on' : (res === false ? '· different networks, select to download' : '');
      });
      sendOffer();
    });
    conn.on('data', data=> handleData(data));
    conn.on('close', ()=>{
      log('disconnected', 'warn');
      beacon.className = 'beacon state-broadcast';
      connectPanel.style.display = '';
      connectedBar.style.display = 'none';
      theirCard.style.display = 'none';
      theirItems = {};
      slotMap = {};
      renderTheirQueue();
      // reset sending state so a fresh connection starts clean
      pendingSendQueue = [];
      activeSlotCount = 0;
      freeSlots.length = 0;
      nextSlotId = 0;
      myQueue.forEach(it=>{ if(it.sendStatus !== 'idle') it.sendStatus = 'idle'; });
      renderMyQueue();
      conn = null; sameNetwork = null;
    });
    conn.on('error', err=> log('connection error: ' + err, 'warn'));
  }

  async function detectSameNetwork(c){
    try{
      await new Promise(r=> setTimeout(r, 700)); // let ICE settle
      const pc = c.peerConnection;
      if(!pc) return null;
      const stats = await pc.getStats();
      let pairs = [], candidates = {};
      stats.forEach(r=>{
        if(r.type === 'candidate-pair') pairs.push(r);
        if(r.type === 'local-candidate' || r.type === 'remote-candidate') candidates[r.id] = r;
      });
      const active = pairs.find(p=> p.nominated || p.selected || p.state === 'succeeded');
      if(!active) return null;
      const local = candidates[active.localCandidateId];
      const remote = candidates[active.remoteCandidateId];
      if(!local || !remote) return null;
      return local.candidateType === 'host' && remote.candidateType === 'host';
    }catch(e){ return null; }
  }

  // ============================================================
  // MY QUEUE (things I can offer)
  // ============================================================
  const myQueueEl = $('#myQueueList');
  let myQueue = []; // {id, kind, file, text, name, size, mime, thumb, sendStatus, el}

  function addFilesToQueue(fileList){
    Array.from(fileList).forEach(f=>{
      const item = { id: randomId(8), kind:'file', file:f, name:f.name, size:f.size, mime:f.type || 'application/octet-stream', thumb:null, sendStatus:'idle' };
      myQueue.push(item);
      generateThumb(f).then(t=>{ item.thumb = t; renderMyQueue(); if(conn && conn.open) sendOffer(); });
    });
    renderMyQueue();
    if(conn && conn.open) sendOffer();
  }
  function addTextToQueue(text){
    if(!text.trim()) return;
    const bytes = new Blob([text]).size;
    myQueue.push({ id: randomId(8), kind:'text', text, name:'text snippet', size:bytes, mime:'text/plain', thumb:null, sendStatus:'idle' });
    renderMyQueue();
    if(conn && conn.open) sendOffer();
  }

  function renderMyQueue(){
    myQueueEl.innerHTML = '';
    if(myQueue.length === 0){
      myQueueEl.innerHTML = '<div class="empty-hint">Nothing queued yet<span class="big">choose files or paste text above</span></div>';
      return;
    }
    myQueue.forEach(item=>{
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div class="item-top">
          <div class="item-left">${thumbHtml(item)}<div class="item-name">${escapeHtml(item.name)}</div></div>
          <button class="item-remove" aria-label="remove">✕</button>
        </div>
        <div class="item-meta">${fmtBytes(item.size)}</div>
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="item-sub">${item.sendStatus === 'idle' ? (conn && conn.open ? 'offered' : 'queued') : escapeHtml(item.sendStatus)}</div>
      `;
      el.querySelector('.item-remove').onclick = ()=>{
        myQueue = myQueue.filter(q=>q.id!==item.id);
        renderMyQueue();
        if(conn && conn.open) sendOffer();
      };
      item.el = el;
      myQueueEl.appendChild(el);
    });
  }

  $('#dropZone').addEventListener('click', ()=> $('#fileInput').click());
  $('#dropZone').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') $('#fileInput').click(); });
  $('#fileInput').addEventListener('change', e=> addFilesToQueue(e.target.files));
  ['dragover','dragenter'].forEach(evt=> $('#dropZone').addEventListener(evt, e=>{ e.preventDefault(); $('#dropZone').classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt=> $('#dropZone').addEventListener(evt, e=>{ e.preventDefault(); $('#dropZone').classList.remove('drag'); }));
  $('#dropZone').addEventListener('drop', e=>{ if(e.dataTransfer.files.length) addFilesToQueue(e.dataTransfer.files); });
  $('#textInput').addEventListener('change', e=>{ if(e.target.value.trim()){ addTextToQueue(e.target.value); e.target.value=''; } });
  renderMyQueue();

  function sendOffer(){
    const items = myQueue.map(it=> ({
      id: it.id, kind: it.kind, name: it.name, size: it.size, mime: it.mime,
      thumb: it.thumb || null, text: it.kind === 'text' ? it.text : undefined
    }));
    conn.send({ type:'offer', items });
  }

  // ============================================================
  // THEIR QUEUE (things offered to me) + request/receive
  // ============================================================
  const theirQueueEl = $('#theirQueueList');
  const parallelSelect = $('#parallelSelect');
  let theirItems = {}; // id -> {meta, status, received, chunks, writer, el, startTime}
  let slotMap = {};    // slot -> item id (receiver side)

  function handleData(data){
    const isBinary = (data instanceof ArrayBuffer) || ArrayBuffer.isView(data);
    if(isBinary) return handleBinaryChunk(data);
    if(!data || typeof data !== 'object' || !data.type) return;
    if(data.type === 'offer') return handleOffer(data.items);
    if(data.type === 'request') return handleRequest(data.ids);
    if(data.type === 'start') return handleStart(data.id, data.slot);
    if(data.type === 'itemdone') return handleItemDone(data.id);
  }

  function handleOffer(items){
    theirCard.style.display = '';
    const incomingIds = new Set(items.map(i=>i.id));
    // drop items no longer offered (unless already fully received)
    Object.keys(theirItems).forEach(id=>{
      if(!incomingIds.has(id) && theirItems[id].status !== 'done'){
        delete theirItems[id];
      }
    });
    items.forEach(meta=>{
      const existing = theirItems[meta.id];
      if(existing){ existing.meta = meta; return; }
      theirItems[meta.id] = { meta, status:'available', received:0, chunks:[], writer:null };
      if(meta.kind === 'text') theirItems[meta.id].status = 'done'; // text arrives inline, nothing to fetch
    });
    renderTheirQueue();

    if(sameNetwork === true){
      const autoIds = items.filter(i=> i.kind === 'file' && theirItems[i.id].status === 'available').map(i=>i.id);
      if(autoIds.length) requestItems(autoIds);
    }
  }

  function requestItems(ids){
    ids = ids.filter(id=> theirItems[id] && theirItems[id].status === 'available');
    if(ids.length === 0) return;
    ids.forEach(id=> theirItems[id].status = 'requested');
    renderTheirQueue();
    conn.send({ type:'request', ids });
  }

  $('#downloadAllBtn').onclick = ()=>{
    const ids = Object.keys(theirItems).filter(id=> theirItems[id].meta.kind === 'file' && theirItems[id].status === 'available');
    requestItems(ids);
  };

  function renderTheirQueue(){
    theirQueueEl.innerHTML = '';
    const ids = Object.keys(theirItems);
    if(ids.length === 0){
      theirQueueEl.innerHTML = '<div class="empty-hint">Nothing offered yet</div>';
      return;
    }
    ids.forEach(id=>{
      const rec = theirItems[id];
      const meta = rec.meta;
      const el = document.createElement('div');
      el.className = 'item' + (rec.status === 'done' ? ' done' : '');
      const autoBadge = (sameNetwork === true && meta.kind === 'file') ? '<span class="badge">auto</span>' : '';
      el.innerHTML = `
        <div class="item-top">
          <div class="item-left">${thumbHtml(meta)}<div class="item-name">${escapeHtml(meta.name)}</div></div>
          <div class="item-meta">${fmtBytes(meta.size)}</div>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${rec.status==='done'?100:0}%"></div></div>
        <div class="item-sub">${statusLabel(rec)}${autoBadge}</div>
      `;
      if(meta.kind === 'text'){
        const pre = document.createElement('div');
        pre.className = 'item-text-preview';
        pre.textContent = meta.text;
        el.appendChild(pre);
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy text';
        copyBtn.onclick = ()=> navigator.clipboard.writeText(meta.text);
        el.appendChild(copyBtn);
      } else if(rec.status === 'available'){
        const btn = document.createElement('button');
        btn.className = 'action-btn';
        btn.textContent = 'Download';
        btn.onclick = ()=> requestItems([id]);
        el.appendChild(btn);
      } else if(rec.status === 'done' && rec.objectUrl){
        if(isImageMime(meta.mime)){
          const viewBtn = document.createElement('button');
          viewBtn.className = 'action-btn view';
          viewBtn.textContent = 'View';
          viewBtn.onclick = ()=> openLightbox(rec.objectUrl);
          el.appendChild(viewBtn);
        }
        const a = document.createElement('a');
        a.href = rec.objectUrl; a.download = meta.name;
        a.className = 'save-link';
        a.textContent = 'Save ' + meta.name;
        el.appendChild(a);
      }
      rec.el = el;
      theirQueueEl.appendChild(el);
    });
  }

  function statusLabel(rec){
    if(rec.status === 'available') return 'available';
    if(rec.status === 'requested') return 'waiting for sender…';
    if(rec.status === 'receiving'){
      const pct = rec.meta.size ? Math.min(100, Math.round((rec.received/rec.meta.size)*100)) : 0;
      const elapsed = (Date.now()-rec.startTime)/1000;
      const speed = elapsed>0 ? fmtBytes(rec.received/elapsed) + '/s' : '';
      return 'receiving ' + pct + '% · ' + speed;
    }
    if(rec.status === 'done') return rec.meta.kind === 'text' ? 'received' : ('saved · ' + fmtBytes(rec.meta.size));
    return rec.status;
  }

  function handleStart(id, slot){
    const rec = theirItems[id];
    if(!rec) return;
    rec.status = 'receiving';
    rec.received = 0;
    rec.chunks = [];
    rec.startTime = Date.now();
    slotMap[slot] = id;
    if(fileSupportsStream()){
      window.showSaveFilePicker({ suggestedName: rec.meta.name })
        .then(async handle=>{ rec.writer = await handle.createWritable(); })
        .catch(()=>{ /* cancelled -> falls back to memory buffering */ });
    }
    renderTheirQueue();
  }

  async function handleBinaryChunk(buf){
    const view = new Uint8Array(buf);
    const slot = view[0];
    const payload = view.subarray(1);
    const id = slotMap[slot];
    const rec = id && theirItems[id];
    if(!rec) return;
    rec.received += payload.byteLength;
    if(rec.writer){
      try{ await rec.writer.write(payload); }
      catch(e){ rec.chunks.push(payload.slice()); rec.writer = null; }
    } else {
      rec.chunks.push(payload.slice());
    }
    if(rec.el){
      const fill = rec.el.querySelector('.bar-fill');
      const sub = rec.el.querySelector('.item-sub');
      if(fill) fill.style.width = Math.min(100, Math.round((rec.received/rec.meta.size)*100)) + '%';
      if(sub) sub.textContent = statusLabel(rec);
    }
  }

  async function handleItemDone(id){
    const rec = theirItems[id];
    if(!rec) return;
    rec.status = 'done';
    if(rec.meta.kind === 'file'){
      if(rec.writer){
        await rec.writer.close();
      } else {
        const blob = new Blob(rec.chunks, { type: rec.meta.mime });
        rec.objectUrl = URL.createObjectURL(blob);
      }
      log('received ' + rec.meta.name, 'ok');
    }
    renderTheirQueue();
  }

  // ---- sender side: fulfilling requests, with parallel slots ----
  let pendingSendQueue = [];
  let activeSlotCount = 0;
  let nextSlotId = 0;
  const freeSlots = [];
  function acquireSlot(){ return freeSlots.length ? freeSlots.pop() : nextSlotId++; }
  function releaseSlot(s){ freeSlots.push(s); }

  function handleRequest(ids){
    ids.forEach(id=>{
      const item = myQueue.find(q=>q.id===id);
      if(item && item.sendStatus === 'idle'){
        item.sendStatus = 'queued';
        pendingSendQueue.push(item);
      }
    });
    renderMyQueue();
    maybeStartWorkers();
  }

  function maybeStartWorkers(){
    const maxP = parseInt(parallelSelect.value, 10) || 2;
    while(activeSlotCount < maxP && pendingSendQueue.length > 0){
      const item = pendingSendQueue.shift();
      activeSlotCount++;
      const slot = acquireSlot();
      transferItem(item, slot).finally(()=>{
        activeSlotCount--;
        releaseSlot(slot);
        maybeStartWorkers();
      });
    }
  }

  function transferItem(item, slot){
    return new Promise(async (resolve)=>{
      item.sendStatus = 'sending 0%';
      renderMyQueue();
      conn.send({ type:'start', id:item.id, slot });

      const file = item.file;
      let offset = 0;
      const startTime = Date.now();

      function waitForBuffer(){
        const dc = conn.dataChannel;
        if(!dc || dc.bufferedAmount < HIGH_WATER) return Promise.resolve();
        return new Promise(res=>{
          const check = ()=>{ if(!dc || dc.bufferedAmount < LOW_WATER) res(); else setTimeout(check, 30); };
          check();
        });
      }
      function readSlice(start){
        return new Promise((res, rej)=>{
          const reader = new FileReader();
          reader.onload = ()=> res(reader.result);
          reader.onerror = ()=> rej(reader.error);
          reader.readAsArrayBuffer(file.slice(start, start + PAYLOAD_CHUNK));
        });
      }

      try{
        while(offset < file.size){
          await waitForBuffer();
          const payload = await readSlice(offset);
          const out = new Uint8Array(payload.byteLength + 1);
          out[0] = slot;
          out.set(new Uint8Array(payload), 1);
          conn.send(out.buffer);
          offset += payload.byteLength;
          const pct = Math.min(100, Math.round((offset/file.size)*100));
          const elapsed = (Date.now()-startTime)/1000;
          const speed = elapsed>0 ? fmtBytes(offset/elapsed) + '/s' : '';
          item.sendStatus = 'sending ' + pct + '% · ' + speed;
          if(item.el){
            const fill = item.el.querySelector('.bar-fill');
            const sub = item.el.querySelector('.item-sub');
            if(fill) fill.style.width = pct + '%';
            if(sub) sub.textContent = item.sendStatus;
          }
        }
        conn.send({ type:'itemdone', id:item.id });
        item.sendStatus = 'sent · ' + fmtBytes(file.size);
        if(item.el) item.el.classList.add('done');
        log('sent ' + item.name, 'ok');
      }catch(e){
        item.sendStatus = 'failed: ' + e.message;
        if(item.el) item.el.classList.add('error');
        log('failed to send ' + item.name + ': ' + e.message, 'warn');
      }
      renderMyQueue();
      resolve();
    });
  }

  initPeer();

})();
</script>
</body>
</html>
